# One-command companion API with the X/Friend stack.
# Usage: docker compose up --build  (after exporting your API keys)

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir xfriend flask &&
             python -c '
               from xfriend.orchestrator import build_from_file
               from flask import Flask, request, jsonify
               app = Flask(__name__)
               companion = build_from_file(\"xfriend.yaml\")
               @app.post(\"/chat\")
               def chat():
                   reply = companion.chat(request.json.get(\"message\", \"\"))
                   return jsonify({**{\"text\": reply.text},
                                   \"media\": [m.to_dict() for m in reply.media]})
               app.run(host=\"0.0.0.0\", port=8000)
             '"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - xfriend_data:/app/xfriend_data
    environment:
      VENICE_INFERENCE_KEY: ${VENICE_INFERENCE_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      LONGCAT_API_KEY: ${LONGCAT_API_KEY}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY}
      SECRETVOICE_API_KEY: ${SECRETVOICE_API_KEY}

volumes:
  xfriend_data: